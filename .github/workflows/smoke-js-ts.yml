name: Smoke js-ts

on:
  pull_request:
    paths:
      - "languages/js-ts/**"
      - "languages/shared/**"
      - "scripts/smoke/**"
      - "scripts/smoke.ts"
      - "scripts/apply.ts"
      - "scripts/audit.ts"
      - "scripts/desired-state.ts"
      - "scripts/packs/**"
      - "package.json"
      - ".github/workflows/smoke-js-ts.yml"
  schedule:
    # Weekly: catch Vite / Biome / Betterleaks upstream breakage.
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: smoke-js-ts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: smoke-js-ts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.16.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install kit dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Betterleaks
        run: |
          bash languages/shared/templates/tools/quality/install-betterleaks.sh "${HOME}/.local/bin"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
      - name: Adoption smoke
        run: pnpm smoke -- --pack js-ts
