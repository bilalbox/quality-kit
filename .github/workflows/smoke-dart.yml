name: Smoke dart

on:
  pull_request:
    paths:
      - "languages/dart/**"
      - "languages/shared/**"
      - "scripts/smoke/**"
      - "scripts/smoke.ts"
      - "scripts/apply.ts"
      - "scripts/audit.ts"
      - "scripts/desired-state.ts"
      - "scripts/packs/**"
      - "package.json"
      - ".github/workflows/smoke-dart.yml"
  schedule:
    # Weekly: catch Flutter / dependency_validator / Betterleaks upstream breakage.
    - cron: "27 6 * * 1"
  workflow_dispatch:

concurrency:
  group: smoke-dart-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: smoke-dart
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.16.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install kit dependencies
        run: pnpm install --frozen-lockfile
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          cache: true
      - name: Install Betterleaks and osv-scanner
        run: |
          bash languages/shared/templates/tools/quality/install-betterleaks.sh "${HOME}/.local/bin"
          bash languages/shared/templates/tools/quality/install-osv-scanner.sh "${HOME}/.local/bin"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
      - name: Install lefthook
        run: |
          set -euo pipefail
          # Packs pin "latest stable"; smoke CI installs a current release binary.
          LEFTHOOK_VERSION=2.2.2
          ASSET="lefthook_${LEFTHOOK_VERSION}_Linux_x86_64.gz"
          mkdir -p "${HOME}/.local/bin"
          curl -fsSL "https://github.com/evilmartians/lefthook/releases/download/v${LEFTHOOK_VERSION}/${ASSET}" \
            | gunzip > "${HOME}/.local/bin/lefthook"
          chmod 0755 "${HOME}/.local/bin/lefthook"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
      - name: Adoption smoke
        run: pnpm smoke -- --pack dart
