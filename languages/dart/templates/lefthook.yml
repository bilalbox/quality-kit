# quality-kit dart hooks — install with: lefthook install

pre-commit:
  parallel: false
  commands:
    secrets:
      run: ./tools/quality/run-secret-scan.sh --staged
    format:
      glob: "*.dart"
      run: ./tools/quality/run-format.sh --staged

pre-push:
  commands:
    gate:
      run: ./tools/quality/gate.sh full
