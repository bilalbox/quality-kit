# quality-kit dart hooks — install with: lefthook install

pre-commit:
  parallel: false
  commands:
    secrets:
      run: ./tools/quality/run-secret-scan.sh --staged
    # Checks staged content only; must never rewrite or re-stage files.
    format:
      glob: "*.dart"
      run: ./tools/quality/dart/run-format.sh --staged

pre-push:
  commands:
    gate:
      run: ./tools/quality/gate.sh full
