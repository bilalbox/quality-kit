name: Setup uv
description: Install uv and sync the project environment
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Sync project
      shell: bash
      run: |
        set -euo pipefail
        if [[ -f uv.lock ]]; then
          uv sync --frozen
        else
          uv sync
        fi
