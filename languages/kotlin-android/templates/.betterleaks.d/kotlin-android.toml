# kotlin-android additions to the shared .betterleaks.toml (appended by
# tools/quality/run-secret-scan.sh). Tables only: no top-level keys.

[[allowlists]]
description = "kotlin-android: screenshot goldens, Gradle/Android build caches"
paths = [
  '''(?i)(?:^|/)build/''',
  '''(?i)(?:^|/)\.gradle/''',
  '''(?i)(?:^|/)\.kotlin/''',
  '''(?i)\.png$''',
  # SDK path is machine-local and not a credential; still scan signing files.
  '''(?i)(?:^|/)local\.properties$'''
]
