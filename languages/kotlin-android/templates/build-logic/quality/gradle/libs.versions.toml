# quality-kit kotlin-android pins. Tool and test-runtime versions live here only;
# QualityKitVersions.kt is generated from this file.
[versions]
agp = "9.5.0"
kotlin = "2.4.21"
# compose-rules 0.6.3+ requires detekt 2.0.0-alpha.6 (Kotlin 2.4 syntax).
detekt = "2.0.0-alpha.6"
composeRules = "0.6.8"
kover = "0.9.11"
roborazzi = "1.77.0"
robolectric = "4.17"
robolectricSdk = "36"
composablePreviewScanner = "0.9.3"
dependencyAnalysis = "3.20.0"
junit = "4.13.2"

[libraries]
android-gradle-api = { module = "com.android.tools.build:gradle-api", version.ref = "agp" }
kotlin-gradle-plugin-api = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin-api", version.ref = "kotlin" }
detekt-gradle-plugin = { module = "dev.detekt:detekt-gradle-plugin", version.ref = "detekt" }
kover-gradle-plugin = { module = "org.jetbrains.kotlinx:kover-gradle-plugin", version.ref = "kover" }
roborazzi-gradle-plugin = { module = "io.github.takahirom.roborazzi:roborazzi-gradle-plugin", version.ref = "roborazzi" }
dependency-analysis-gradle-plugin = { module = "com.autonomousapps:dependency-analysis-gradle-plugin", version.ref = "dependencyAnalysis" }
