# quality-kit kotlin-android — merge into the root gradle.properties (apply never overwrites it).

# Fast, cache-friendly builds; every plugin in the gate is configuration-cache compatible.
org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# quality-kit.android knobs.
qualityKit.variant=debug
# Kover line coverage floor per module (0 = off). Greenfield: start at 80 and only raise it.
qualityKit.minLineCoverage=0
qualityKit.allWarningsAsErrors=true
qualityKit.addTestDependencies=true
